[project]
name = "diffusion-profiled"
version = "0.1.0"
description = "Profling and optimized code for CIFAR10 DDPM"
readme = "README.md"
requires-python = "==3.13.1"
dependencies = [
    "torch==2.13.*",
    "torchvision",
    "tqdm==4.67.1",
    "einops==0.7.0",
    "numpy",
    "wandb>=0.25.0",
    "torch-tb-profiler>=0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diffusion", "extra"]

[dependency-groups]
dev = [
    "ruff==0.9.3",
    "pyrefly>=1.1.1",
]

[tool.ruff]
line-length = 100
lint.extend-select = [
    "UP035",
]

[tool.ty.rules]
unresolved-attribute = "ignore"
unused-type-ignore-comment = "ignore"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
]
